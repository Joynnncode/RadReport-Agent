name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # Mondays, catches upstream weight/API drift

jobs:
  fast:
    # The fast suite: no model weights, no network. Runs on every push and
    # finishes in under a minute, which is the only way a test suite actually
    # gets used.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -m "not slow and not network" -q

  docs:
    # Validate Mermaid diagrams. GitHub renders them server-side and replaces a
    # broken one with a raw parser error, which is the first thing a reviewer
    # sees. No Python test can catch that.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --no-fund --no-audit mermaid@11 jsdom
      - run: node scripts/check_mermaid.mjs README.md docs/*.md DECISIONS.md

  docker:
    # Build the image on every push. It is the one artefact that cannot be
    # verified by unit tests, and it breaks quietly: a wheel index change or a
    # weights URL going stale surfaces only at build time.
    #
    # On main it is also published to GHCR, which is where Azure Container Apps
    # pulls it from. Built here and not on the laptop: the laptop is arm64, the
    # cloud is amd64, and this runner builds the architecture that actually ships.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        # GHCR rejects upper case, and the repository is RadReport-Agent.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # Roll the Azure Container App onto the image just published, but only after
    # the fast suite passed on the same commit. Skipped until the Azure variables
    # exist (docs/azure-deploy.md, step 7), so forks and an unprovisioned app stay
    # green. Signs in with OIDC: GitHub holds no Azure secret to leak, only a
    # trust relationship scoped to this repository's main branch.
    needs: [fast, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      APP: ${{ vars.AZURE_CONTAINERAPP }}
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Point the app at this commit's image
        # The commit SHA, not :latest. Re-pointing at a tag whose name has not
        # changed creates no new revision, and "which commit is live" should be
        # answerable from the portal.
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update --name "$APP" --resource-group "$RG" \
            --image "ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
      - name: Wait for the new revision to serve
        # A green update only means Azure accepted the request. The app scales to
        # zero, so the health request is also what wakes it; allow ten minutes
        # for a ~1 GB (compressed) image pull on a cold replica.
        run: |
          fqdn=$(az containerapp show -n "$APP" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)
          for _ in $(seq 60); do
            curl -fsS -o /dev/null "https://$fqdn/_stcore/health" || true
            latest=$(az containerapp show -n "$APP" -g "$RG" --query properties.latestRevisionName -o tsv)
            ready=$(az containerapp show -n "$APP" -g "$RG" --query properties.latestReadyRevisionName -o tsv)
            if [ "$latest" = "$ready" ] && curl -fsS -o /dev/null "https://$fqdn/_stcore/health"; then
              echo "revision $latest is serving at https://$fqdn"
              exit 0
            fi
            sleep 10
          done
          echo "revision $latest did not become ready within 10 minutes"
          exit 1

  models:
    # The slow suite: downloads real weights. Scheduled + manual only, because
    # it takes minutes and the weights rarely change.
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_data.py --reports-only
      - run: pytest -m "slow" -q

  eval-smoke:
    # A five-case smoke eval on a schedule, as a canary for the things unit
    # tests cannot see: a retired model, a changed tool-calling API, a provider
    # that started refusing our prompts. Needs a real key, so it is skipped
    # automatically on forks where the secret is not available.
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build corpus
        run: python scripts/fetch_data.py --reports-only
      - name: Smoke eval
        if: env.GROQ_API_KEY != ''
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m evals.run --provider groq --limit 5 --no-judge --delay 2
