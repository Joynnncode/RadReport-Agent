services:
  radreport:
    build: .
    ports:
      - "8501:8501"
    environment:
      # Read from the host shell or a .env file. Never baked into the image:
      # a key in a layer stays in the layer even if a later step removes it.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      NCBI_EMAIL: ${NCBI_EMAIL:-}
    volumes:
      # Dataset stays on the host. Run `python scripts/fetch_data.py` first.
      - ./data:/app/data:ro
      # Writable outputs, so a rebuilt container does not lose its traces.
      - ./artifacts:/app/artifacts
      - ./traces:/app/traces
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
